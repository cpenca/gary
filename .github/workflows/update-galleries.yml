name: Update artwork galleries

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'scripts/build-gallery-manifest.py'
      - '.github/workflows/update-galleries.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Build gallery image list
        run: python3 scripts/build-gallery-manifest.py

      - name: Save gallery manifest to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update artwork galleries"
            git push
          fi
